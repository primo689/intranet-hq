name: Build Intranet HQ image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "paragdise-intranet-hq/umbrel-app.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          # version comes from the Umbrel manifest, so bumping it there ships a new image
          echo "tag=$(sed -n 's/^version: *\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p' paragdise-intranet-hq/umbrel-app.yml)" >> "$GITHUB_OUTPUT"
          # container registry names must be lowercase (Primo689 -> primo689)
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/intranet-hq:${{ steps.v.outputs.tag }}
            ghcr.io/${{ steps.v.outputs.owner }}/intranet-hq:latest
