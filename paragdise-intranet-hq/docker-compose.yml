version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: paragdise-intranet-hq_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/primo689/intranet-hq:1.0.0
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: America/Chicago
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
